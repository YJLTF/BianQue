server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 平台 API → bq-server（含探针接入 /api/agent/**、告警接入 /api/alerts/ingest）
    # 上游走 Docker 内置 DNS 动态解析（valid=3s）：server 容器重建换 IP 后 nginx 不再缓存死地址 502
    location /api/ {
        resolver 127.0.0.11 valid=3s ipv6=off;
        set $bq_upstream http://server:8080;
        proxy_pass $bq_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        client_max_body_size 20m;
    }

    # 文档中心静态资源（Arthas 4.3.5 离线文档）→ bq-server
    # 只代理版本化静态前缀；/docs 本身是前端 SPA 路由，走下方 try_files 回退
    location /docs/4.3.5/ {
        resolver 127.0.0.11 valid=3s ipv6=off;
        set $bq_upstream http://server:8080;
        proxy_pass $bq_upstream;
        proxy_set_header Host $host;
    }

    # 前端 SPA 路由回退
    # 指纹静态资源长缓存；index.html 不缓存（升级镜像后浏览器立即拿到新页面）
    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }
    location = /index.html {
        expires -1;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 安全响应头：CSP 收敛资源来源；X-Frame-Options 用 SAMEORIGIN——文档中心正文是同源 iframe，
    # DENY 会把自己平台的 iframe 一并拦掉（外站嵌入仍被拒绝，防点击劫持意图不变）；防 MIME 嗅探；不泄露 referrer
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
