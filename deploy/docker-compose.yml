# 扁鹊 · BianQue 开发基础设施（宿主机直跑后端/前端时使用）
# 平台全容器一键部署见 docker-compose.prod.yml
# 启动：docker compose -f deploy/docker-compose.yml up -d mysql redis

services:
  mysql:
    image: mysql:8.4
    container_name: bq-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-bianque_dev_only}
      MYSQL_DATABASE: bianque
      MYSQL_USER: bianque
      MYSQL_PASSWORD: ${BIANQUE_DB_PASSWORD:-bianque123}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7.4
    container_name: bq-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data:
