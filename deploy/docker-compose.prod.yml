# 扁鹊 · BianQue 平台全容器一键部署
# 架构：镜像 = 纯运行环境承载（tag 默认 latest，环境不变不重建）；代码产物走 deploy/artifacts 挂载
# 升级 = 替换 deploy/artifacts 产物 + docker compose restart（前端免重启；无需重建镜像）
# 首次部署：① 按 README「构建发布」出包并放入 deploy/artifacts/（bq-server.jar / bq-agent.jar / web/）
#           ② docker compose -f docker-compose.prod.yml up -d --build   （构建为环境装载，秒级）
# 可选：附加本机探针演示  docker compose -f docker-compose.prod.yml --profile probe up -d probe
# 访问：http://<主机>/（前端） · http://<主机>:8080/api/health（后端直连，供探针注册）

services:
  mysql:
    image: mysql:8.4
    container_name: bq-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-bianque_dev_only}
      MYSQL_DATABASE: bianque
      MYSQL_USER: bianque
      MYSQL_PASSWORD: ${BIANQUE_DB_PASSWORD:-bianque123}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4
    container_name: bq-redis
    volumes:
      - redis-data:/data
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.server
    image: bianque/server:${BQ_VERSION:-latest}
    container_name: bq-server
    # 容器内无本机 JVM 可 attach：关闭本机纳管通道，真实诊断一律走节点探针
    # 探针包下载路径指向挂载目录（升级替换 artifacts 后 GET /api/agent/download 即新包）
    command:
      - "--bianque.execution.local-enabled=false"
      - "--bianque.agent.jar-path=/app/artifacts/bq-agent.jar"
      - "--bianque.agent.token=${AGENT_TOKEN:-}"
      - "--bianque.alerts.ingest-token=${INGEST_TOKEN:-}"
      - "--bianque.llm.base-url=${LLM_BASE_URL:-}"
    environment:
      # 数据库密码透传给服务端（application-docker.yml 的 ${BIANQUE_DB_PASSWORD}），与 mysql 服务同源
      BIANQUE_DB_PASSWORD: ${BIANQUE_DB_PASSWORD:-bianque123}
      BIANQUE_LLM_API_KEY: ${LLM_API_KEY:-}
      # 生产默认关闭演示模式（无模拟靶场/种子告警/演示账号）；BIANQUE_ADMIN_PASSWORD 为引导 admin 初始口令
      # （仅 admin 账号不存在时生效一次，之后改密走「平台管理」页）
      BIANQUE_DEMO_ENABLED: ${BIANQUE_DEMO_ENABLED:-false}
      BIANQUE_ADMIN_PASSWORD: ${BIANQUE_ADMIN_PASSWORD:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - server-data:/app/data
      # 代码产物挂载（升级 = 替换宿主文件 + restart；目录挂载对文件替换路径级生效）
      - ./artifacts:/app/artifacts:ro
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.web
    image: bianque/web:${BQ_VERSION:-latest}
    container_name: bq-web
    depends_on:
      - server
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      # 前端静态产物挂载：替换 deploy/artifacts/web 后即时生效（无需重启）
      - ./artifacts/web:/usr/share/nginx/html:ro
    restart: unless-stopped

  # 本机探针演示（--profile probe）：仅 Linux 主机可 attach 宿主 JVM（pid=host + /tmp 挂载）
  probe:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.probe
    image: bianque/probe:${BQ_VERSION:-latest}
    container_name: bq-probe
    pid: "host"
    environment:
      SERVER_URL: http://server:8080
      AGENT_TOKEN: ${AGENT_TOKEN:-}
      PROBE_NAME: ${PROBE_NAME:-}
      PROBE_INTERVAL: ${PROBE_INTERVAL:-5}
    volumes:
      - /tmp:/tmp
      # 探针包挂载（升级 = 替换 artifacts/bq-agent.jar + restart）
      - ./artifacts:/probe/artifacts:ro
    depends_on:
      - server
    profiles: ["probe"]
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  server-data:
