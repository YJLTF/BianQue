server:
  port: 8080
  error:
    # 错误体带 message，前端可展示"权限不足（只读 无 diag:execute）"等可读原因
    include-message: always
spring:
  application:
    name: bianque-server
  datasource:
    # S1：默认 H2 文件库（MODE=MySQL，语义兼容）；生产切 profile=mysql 走真 MySQL
    url: jdbc:h2:file:./data/bianque;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

bianque:
  execution:
    # mock：拟真演示通道；local：本机 as.sh 真实执行（按实例路由）
    mode: mock
    # 本机真实进程纳管开关（127.0.0.1 + 登录墙之内；生产环境建议 false）
    local-enabled: true
    # 真实通道：java -jar arthas-boot.jar（纯 Java，无 telnet 依赖，Windows/Linux 通用）
    boot-jar-path: docs/research/arthas-inspect/arthas-boot.jar
    # 常驻会话快路径：attach 一次后 HTTP 直连 agent（毫秒级）；热命令 version/jvm/memory/thread 走此通道
    fast-path: true
    fast-port-base: 18600
  docs:
    unpack-root: ""   # 空值时按运行目录自动探测 docs/arthas-docs/4.3.5
  agent:
    # 平台 Agent 节点接入令牌（X-Agent-Token）：空=开放（仅限内网演示）；生产必配
    token: ""
    # 节点程序包下载路径（GET /api/agent/download）；将 bq-agent.jar 拷贝至此生效
    jar-path: agents/bq-agent.jar
  llm:
    # AI 问诊 LLM 接入（OpenAI Chat Completions 兼容端点，不含 /chat/completions 尾巴）。
    # 以下为首次播种默认值，运行时在「AI 问诊」页在线编辑（落库 llm_config）；api-key 支持 env：BIANQUE_LLM_API_KEY
    base-url: ""
    api-key: ""
    model: ""
    system-prompt: >-
      你是扁鹊（BianQue）平台的线上 JVM 诊断助手，面向运维与研发。回答要求：
      1) 先给结论，再列证据（引用提供的线程栈/内存/JVM 数据），最后给处置建议；
      2) 建议执行的 Arthas 命令仅限只读白名单（thread/memory/jvm/dashboard/tt/watch 只读用法），绝不建议 ognl/redefine/stop 等高危命令；
      3) 信息不足时明确说明还缺哪类数据，不要臆测；
      4) 使用简体中文，简洁分点。
  session:
    ttl-minutes: 30
  alerts:
    # 告警接入（入站预留）：配置 token 后 /api/alerts/ingest 开放，外部告警系统以 X-Alert-Token 头推入
    ingest-token: ""
    # 告警通知（出站预留）：通用 webhook，新告警/取证完成时 POST JSON；不绑定企微/钉钉
    webhook-url: ""
  auth:
    token-ttl-hours: 8

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/bianque?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: bianque
    password: ${BIANQUE_DB_PASSWORD:bianque123}
  jpa:
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: 127.0.0.1
      port: 6379
